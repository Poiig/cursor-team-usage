# Cursor Team Usage — 多账号用量看板
# 用法：
#   docker compose up -d --build
#   浏览器打开 http://localhost:3780
#
# 注意：会话 Token 等同登录态。默认仅映射本机端口；若暴露到局域网/公网请自行加反向代理与访问控制。

services:
  cursor-team-usage:
    build: .
    image: cursor-team-usage:latest
    container_name: cursor-team-usage
    restart: unless-stopped
    ports:
      - "3780:3780"
    environment:
      HOST: "0.0.0.0"
      PORT: "3780"
      # 默认 file；改用 Postgres 时取消下行与 postgres 服务注释
      # STORE_DRIVER: postgres
      # DATABASE_URL: postgresql://postgres:postgres@postgres:5432/cursor_team_usage
      # TZ: "Asia/Shanghai"
    volumes:
      # file 存储：账号名册与会话 Token
      - ./data:/app/data
