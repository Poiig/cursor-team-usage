<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>账号详情 · Cursor Team Usage</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="standalone">
    <div class="app">
      <header class="header">
        <div class="header-top">
          <div class="brand">
            <div class="brand-title">
              <img class="brand-mark" src="/favicon.svg" width="28" height="28" alt="" />
              <h1>Cursor Team Usage</h1>
            </div>
            <p class="footer-links">
              <a href="/" data-back>← 返回账号列表</a>
              <span>·</span>
              <a href="https://cursor.com/dashboard/usage" target="_blank" rel="noreferrer">Official usage ↗</a>
            </p>
          </div>
        </div>
      </header>

      <section class="panel detail-panel" id="detailRoot">
        <div class="panel-head">
          <div class="detail-head">
            <div>
              <h2 id="detailTitle">账号详情</h2>
              <p id="detailSub" class="muted"></p>
              <div id="detailMeta" class="badges detail-meta"></div>
            </div>
          </div>
          <div class="toolbar">
            <nav class="cycle-tabs" aria-label="账单周期">
              <a class="cycle-tab active" data-cycle="current" href="#">当前周期</a>
              <a class="cycle-tab" data-cycle="prev" href="#">上个周期</a>
            </nav>
            <button type="button" class="btn" id="btnDetailRefresh">刷新用量</button>
            <button type="button" class="btn" id="btnUserRules">下载用户规则</button>
          </div>
        </div>
        <section id="prevCycle" class="prev-cycle hidden" aria-label="上个账单周期"></section>
        <div id="currentCycleView">
        <div id="detailMeters" class="panel-lines"></div>
        <div class="charts">
          <article class="chart-card">
            <h3>Daily spend (30d)</h3>
            <div id="chartSpend" class="chart-box"></div>
          </article>
          <article class="chart-card">
            <h3>Daily tokens (30d)</h3>
            <div id="chartTokens" class="chart-box"></div>
          </article>
          <article class="chart-card" id="usage-percent">
            <h3>Daily usage % (Total)</h3>
            <div id="chartUsagePercent" class="chart-box"></div>
          </article>
        </div>
        <div class="pace-models-row">
          <div id="detailPace" class="pace-card hidden"></div>
          <article class="chart-card chart-models">
            <h3>当日模型统计</h3>
            <div id="chartTodayModels" class="chart-box"></div>
          </article>
          <article class="chart-card chart-models">
            <h3>Top models (cycle)</h3>
            <div id="chartModels" class="chart-box"></div>
          </article>
        </div>

        <div class="usage-section">
          <div class="panel-head usage-head">
            <h3>Usage events</h3>
            <div class="toolbar">
              <select id="eventsDays" aria-label="时间范围">
                <option value="1" selected>今天</option>
                <option value="7">近 7 天</option>
                <option value="30">近 30 天</option>
                <option value="90">近 90 天</option>
              </select>
              <select id="eventsModel" aria-label="按模型筛选">
                <option value="">全部模型</option>
              </select>
              <button type="button" class="btn" id="btnLoadEvents">同步并刷新</button>
              <button type="button" class="btn" id="btnExportCsv">Export CSV</button>
            </div>
          </div>
          <p id="eventsHint" class="muted usage-hint">按筛选从数据库读取；滚动到底加载更多。</p>
          <div class="usage-table-wrap" id="usageTableWrap">
            <table class="usage-table" id="usageTable">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Type</th>
                  <th>Model</th>
                  <th>Tokens</th>
                  <th>Cost</th>
                </tr>
              </thead>
              <tbody id="usageBody">
                <tr>
                  <td colspan="5" class="muted">正在加载…</td>
                </tr>
              </tbody>
            </table>
            <div id="eventsScrollSentinel" class="events-scroll-sentinel" aria-hidden="true"></div>
          </div>
        </div>
        </div>
      </section>
    </div>

    <div id="toast" class="toast hidden" role="status"></div>
    <script type="module" src="/detail.js"></script>
  </body>
</html>
