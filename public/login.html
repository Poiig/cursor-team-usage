<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登录 · Cursor Team Usage</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="standalone login-body">
    <main class="login-card">
      <div class="brand-title login-brand">
        <img class="brand-mark" src="/favicon.svg" width="36" height="36" alt="" />
        <h1>登录</h1>
      </div>
      <p id="applicationStatus" class="application-status hidden"></p>
      <form id="loginForm" class="login-form">
        <label>
          用户名
          <input id="username" name="username" autocomplete="username" required autofocus />
        </label>
        <label>
          密码
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          />
        </label>
        <p id="loginError" class="error-box hidden"></p>
        <button type="submit" class="btn primary" id="btnLogin">登录</button>
      </form>
      <p class="hint login-hint">
        <a href="/register.html">申请注册</a>
      </p>
    </main>
    <script type="module" src="/login.js"></script>
  </body>
</html>
