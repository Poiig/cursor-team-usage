# 本机联调（macOS Apple Container）：仓库根执行 ./up.sh [--build]
# Apple container 无 docker compose；本文件仅作仓库内指针，避免误用 compose 起一套。
#
# 依赖：brew install container && container system start
# 环境：仓库根 .env（可对照 6.80 /opt/cursor-team-usage/.env；PUBLIC_BASE_URL 用本机）

name: cursor-team-usage-mac-use-up-sh

services:
  cursor-team-usage:
    image: cursor-team-usage:local
    profiles: ["disabled"]
    command: ["sh", "-c", "echo Use ./up.sh --build && exit 1"]
